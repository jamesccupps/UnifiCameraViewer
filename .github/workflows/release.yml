# Push a tag vX.Y.Z (matching package.json) to build, sign, check and publish a release.
# Two jobs, so the release key never meets the build's dependencies:
# - build installs them (npm ci), tests, builds and smoke-tests the files, unsigned, with a read-only
#   token and no secrets;
# - publish starts from a fresh checkout with no node_modules, signs latest.json from the
#   UPDATE_SIGNING_KEY secret with Node's own modules only, checks it against the public key built
#   into the app, and publishes.
# A compromised dependency could still tamper with what it builds, but it can't take the key and
# sign whatever it likes later.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
          cache: npm

      - name: Tag must match package.json
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME, but package.json says $v" }

      - run: npm ci

      - name: Make sure the Electron runtime is downloaded
        run: node node_modules/electron/install.js

      - name: npm test
        run: npm test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

      - name: Build the zip, the installer and the small update (unsigned here)
        run: npm run build:win

      # npm test runs the app from source; only the packaged app loads its pages from app.asar through
      # the install's own path. Run it from a plain folder and an awkward one and check its IPC works.
      - name: Run the packaged app from two install folders
        run: node scripts/check-packaged.mjs "dist/Protect Panes-win32-x64"

      - name: Install this installer, check its version, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process dist\ProtectPanes-Setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $entry = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty |
            Where-Object { $_.DisplayName -like 'Protect Panes*' } | Select-Object -First 1
          $dir = Split-Path ($entry.UninstallString -replace '^"([^"]+)".*$', '$1')
          $exe = Join-Path $dir 'ProtectPanes.exe'
          $v = (Get-Item $exe).VersionInfo.ProductVersion
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "installed $v, expected $env:GITHUB_REF_NAME" }
          $uninstaller = Get-ChildItem $dir -Filter 'Uninstall *.exe' | Select-Object -First 1
          Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "uninstall left $exe behind" }
          "installer ok: $v"

      # The files exactly as tested above; no small update (.gz) for a release with a
      # release-notes/vX.Y.Z.full-update file. They're compressed already, so no compression here.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/ProtectPanes-Setup.exe
            dist/ProtectPanes-win32-x64.zip
            dist/ProtectPanes-app.asar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The repository's own scripts and lockfile; no npm ci, so no dependency code runs in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Sign latest.json
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::The UPDATE_SIGNING_KEY secret isn't set; an unsigned release would never reach installed copies."
            exit 1
          fi
          key="$RUNNER_TEMP/update-signing-key.pem"
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" | tr -d '\r' > "$key"
          PANES_SIGNING_KEY="$key" node scripts/sign-release.js dist/ProtectPanes-win32-x64.zip

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/update-signing-key.pem"

      - name: Verify latest.json against the key built into the app
        # The tag through the environment, not pasted into the script: nothing a ref name holds runs.
        run: node scripts/verify-release.mjs dist "$GITHUB_REF_NAME"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="release-notes/$tag.md"
          opts=(--repo "$GITHUB_REPOSITORY" --title "Protect Panes ${tag#v}" --verify-tag)
          if [ -f "$notes" ]; then opts+=(--notes-file "$notes"); else opts+=(--generate-notes); fi
          files=(dist/ProtectPanes-Setup.exe dist/ProtectPanes-win32-x64.zip)
          if [ -f dist/ProtectPanes-app.asar.gz ]; then files+=(dist/ProtectPanes-app.asar.gz); fi
          gh release create "$tag" "${files[@]}" dist/latest.json "${opts[@]}"
