# npm test on Windows: every suite runs the real app (Electron) against mock cameras and fake
# UniFi OS consoles. Screenshots, result.json and logs are kept as an artifact for a week.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
          cache: npm

      - run: npm ci

      # Electron's postinstall can leave dist/ empty; install.js is a no-op when it's already there.
      - name: Make sure the Electron runtime is downloaded
        run: node node_modules/electron/install.js

      - name: npm test
        run: npm test
        env:
          # The suites write results to os.tmpdir(); point it somewhere the artifact step can find.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/protect-panes-*
            !${{ runner.temp }}/protect-panes-*/**/*.pem
          retention-days: 7
          if-no-files-found: warn
