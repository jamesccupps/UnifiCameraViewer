# npm test on Windows: every suite runs the real app (Electron) against mock cameras and fake
# UniFi OS consoles. Screenshots, result.json and logs are kept as an artifact for a week.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
          cache: npm

      - run: npm ci

      # Electron's postinstall can leave dist/ empty; install.js is a no-op when it's already there.
      - name: Make sure the Electron runtime is downloaded
        run: node node_modules/electron/install.js

      - name: npm test
        run: npm test
        env:
          # The suites write results to os.tmpdir(); point it somewhere the artifact step can find.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/protect-panes-*
            !${{ runner.temp }}/protect-panes-*/**/*.pem
          retention-days: 7
          if-no-files-found: warn

  # The real Setup.exe on a throwaway runner: silent per-user install, the files and uninstaller the
  # app's installKind() relies on, a self-test start of the installed copy, then a silent uninstall.
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
          cache: npm

      - run: npm ci

      - name: Make sure the Electron runtime is downloaded
        run: node node_modules/electron/install.js

      - name: Build the zip and the installer (unsigned here)
        run: npm run build:win

      - name: Install silently, start it, uninstall silently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process dist\ProtectPanes-Setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          # Find the install the way Windows does: the Add/Remove Programs entry it registered.
          $entry = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty |
            Where-Object { $_.DisplayName -like 'Protect Panes*' } | Select-Object -First 1
          if (-not $entry) { throw "no Add/Remove Programs entry for Protect Panes" }
          "entry: $($entry.DisplayName) $($entry.DisplayVersion) | InstallLocation=$($entry.InstallLocation) | $($entry.UninstallString)"
          $dir = $entry.InstallLocation
          Get-ChildItem $dir | Select-Object -ExpandProperty Name | Select-Object -First 40
          $exe = Join-Path $dir 'ProtectPanes.exe'
          if (-not (Test-Path $exe)) { throw "no ProtectPanes.exe in $dir" }
          $uninstaller = Get-ChildItem $dir -Filter 'Uninstall *.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw "no 'Uninstall *.exe' next to the app; installKind() would treat it as a folder install" }
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $lnk = Get-ChildItem $menu -Recurse -Filter 'Protect Panes*.lnk' | Select-Object -First 1
          if (-not $lnk) { throw "no Start menu shortcut under $menu" }
          "installed $((Get-Item $exe).VersionInfo.ProductVersion) to $dir with $($uninstaller.Name), shortcut $($lnk.FullName)"
          $lnk = $lnk.FullName

          $ud = Join-Path $env:RUNNER_TEMP 'pp-installed'
          New-Item -ItemType Directory -Force $ud | Out-Null
          '{"version":1,"consoles":[],"windows":{},"settings":{"updateSource":""}}' | Set-Content -Encoding ascii (Join-Path $ud 'config.json')
          $env:PANES_USER_DATA = $ud; $env:PANES_SELFTEST_DIR = "$ud\results"; $env:PANES_SELFTEST_SEC = '8'
          Start-Process $exe -Wait
          if (-not (Test-Path "$ud\results\result.json")) { throw "the installed app didn't complete a self-test run" }
          Get-Content "$ud\protect-panes.log"

          # The NSIS uninstaller copies itself to %TEMP% and returns at once, so wait for the files to go.
          Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "uninstall left $exe behind" }
          if (Test-Path $lnk) { throw "uninstall left the Start menu shortcut" }
          'uninstalled cleanly'
