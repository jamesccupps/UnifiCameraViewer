<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src blob:; img-src 'self' data:">
  <title>Camera</title>
  <link rel="stylesheet" href="camera.css">
</head>
<body>
  <video id="video" muted autoplay playsinline disablepictureinpicture></video>
  <canvas id="dewarp" class="dewarp hidden"></canvas>
  <canvas id="calib" class="calib hidden"></canvas>

  <div id="status" class="status hidden" role="status">
    <div class="spinner"></div>
    <div id="status-text"></div>
  </div>

  <div id="label" class="label">
    <span id="dot" class="dot"></span>
    <span id="label-text"></span>
  </div>

  <header id="bar" class="bar">
    <div class="drag">
      <span id="bar-title"></span>
      <span id="bar-console" class="muted"></span>
    </div>
    <button id="btn-top" class="icon" title="Always on top" aria-label="Always on top">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 2h6l-1 4 2 2v1H9v5l-1 1-1-1V9H4V8l2-2z"/></svg>
    </button>
    <button id="btn-menu" class="icon" title="Options (or right-click)" aria-label="Options">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg>
    </button>
    <button id="btn-close" class="icon close" title="Close this camera" aria-label="Close">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </header>

  <div id="calib-hint" class="calib-hint hidden">
    <span>Line the green circle up with the edge of the round fisheye picture. Drag to move, scroll to resize, double-click to auto-detect.</span>
    <button type="button">Done</button>
  </div>

  <div id="notice" class="notice hidden" role="status"></div>
  <div id="highlight" class="highlight"></div>
  <script src="dewarp.js"></script>
  <script src="camera.js"></script>
</body>
</html>
